openapi: 3.0.3
info:
  title: API Jeux Vidéo
  version: 1.0.0
  description: API CRUD pour gérer une collection de jeux vidéo.
servers:
  - url: http://localhost:3000
    description: Serveur local de développement
paths:
  /:
    get:
      summary: Vérifier que l'API fonctionne
      responses:
        "200":
          description: L'API est opérationnelle
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: API Jeux Vidéo opérationnelle
  /api/games:
    get:
      summary: Récupérer tous les jeux
      operationId: getAllGames
      responses:
        "200":
          description: Liste des jeux
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Ajouter un jeu
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameInput"
      responses:
        "201":
          description: Jeu créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant numérique du jeu
        schema:
          type: integer
          minimum: 1
    get:
      summary: Récupérer un jeu
      operationId: getGameById
      responses:
        "200":
          description: Jeu trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Modifier un jeu
      operationId: updateGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameInput"
      responses:
        "200":
          description: Jeu modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Supprimer un jeu
      operationId: deleteGame
      responses:
        "204":
          description: Jeu supprimé
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalServerError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Données invalides
        details:
          type: array
          items:
            type: string
          example:
            - Le titre est obligatoire
            - La note doit être comprise entre 0 et 10
    Game:
      type: object
      required:
        - id
        - title
        - editor
        - releaseYear
        - genre
        - rating
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "The Witcher 3: Wild Hunt"
        editor:
          type: string
          example: CD Projekt
        releaseYear:
          type: integer
          example: 2015
        genre:
          type: string
          example: RPG
        rating:
          type: number
          format: float
          example: 9.5
    CreateGameInput:
      type: object
      required:
        - title
        - editor
        - releaseYear
        - genre
        - rating
      properties:
        title:
          type: string
          example: "The Witcher 3: Wild Hunt"
        editor:
          type: string
          example: CD Projekt
        releaseYear:
          type: integer
          example: 2015
        genre:
          type: string
          example: RPG
        rating:
          type: number
          format: float
          example: 9.5
